name: Prisma Migrate
on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment"
        default: "production"
      seed:
        type: boolean
        description: "Run Prisma seed script after applying migrations"
        default: false
      tailscale:
        type: boolean
        description: "Connect to Tailscale before running migrations"
        default: false
      tailscale_tags:
        type: string
        description: "Comma-separated Tailscale tags applied to the ephemeral node (defaults to the TS_TAGS variable)"
        default: ""
      infisical:
        type: boolean
        description: "Fetch DATABASE_URL from Infisical instead of the DATABASE_URL secret (requires Tailscale for a private instance)"
        default: false
      infisical_path:
        type: string
        description: "Infisical secret path containing DATABASE_URL"
        default: "/"
    secrets:
      DATABASE_URL:
        description: "Database connection string (not needed when Infisical is used)"
        required: false
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client ID"
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth client secret"
        required: false
      TAILSCALE_AUTHKEY:
        description: "Tailscale auth key (alternative to OAuth)"
        required: false

jobs:
  migrate:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Join tailnet
        if: ${{ inputs.tailscale }}
        uses: cabrera-evil/workflows/.github/actions/tailscale@master
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: ${{ inputs.tailscale_tags || vars.TS_TAGS }}

      - name: Fetch secrets (Infisical)
        if: ${{ inputs.infisical }}
        uses: cabrera-evil/workflows/.github/actions/infisical@master
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env: ${{ inputs.environment }}
          path: ${{ inputs.infisical_path }}
          secret-name: DATABASE_URL

      - name: Database URL from secret
        if: ${{ !inputs.infisical }}
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::DATABASE_URL secret is required when Infisical is not used"; exit 1; }
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Check migration status
        id: migration-status
        run: pnpm prisma migrate status
        continue-on-error: true

      - name: Execute migration
        if: steps.migration-status.outcome == 'failure'
        run: pnpm prisma migrate deploy

      - name: Verify migration
        if: steps.migration-status.outcome == 'failure'
        run: pnpm prisma migrate status

      - name: Seeding Database
        if: ${{ inputs.seed && steps.migration-status.outcome == 'failure' }}
        run: pnpm prisma db seed
