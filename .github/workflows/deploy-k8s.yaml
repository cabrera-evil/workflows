name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Deployment environment (e.g. production, preview)"
        required: true
      short_sha:
        type: string
      docker_image:
        type: string
        required: true
        description: "Image name without tag and owner (e.g., my-api)"
      tailscale:
        type: boolean
        description: "Join the tailnet first (config from TS_* variables, keyless OIDC by default)"
        default: false
      tailscale_tags:
        type: string
        description: "Comma-separated Tailscale tags applied to the ephemeral node (defaults to the TS_TAGS variable)"
        default: ""
      infisical:
        type: boolean
        description: "Fetch secrets from Infisical (config from INFISICAL_* variables, keyless OIDC by default)"
        default: false
      infisical_path:
        type: string
        description: "Infisical secret path (defaults to /<docker_image>)"
        default: ""
      k8s_secret_name:
        type: string
        description: "Name of the Secret generated from Infisical (defaults to <docker_image>-secret)"
        default: ""
    secrets:
      KUBECONFIG:
        description: Base64-encoded kubeconfig file
        required: true
      K8S_SECRET:
        description: Base64-encoded Kubernetes secret YAML (not needed when Infisical is used)
        required: false
      TS_OAUTH_CLIENT_ID:
        description: "Tailscale OAuth client ID"
        required: false
      TS_OAUTH_SECRET:
        description: "Tailscale OAuth client secret"
        required: false
      TAILSCALE_AUTHKEY:
        description: "Tailscale auth key (alternative to OAuth)"
        required: false

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Join tailnet
        if: ${{ inputs.tailscale }}
        uses: cabrera-evil/workflows/.github/actions/tailscale@master
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID || vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: ${{ inputs.tailscale_tags || vars.TS_TAGS }}

      - name: Fetch secrets (Infisical)
        if: ${{ inputs.infisical }}
        uses: cabrera-evil/workflows/.github/actions/infisical@master
        with:
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env: ${{ inputs.environment }}
          path: ${{ inputs.infisical_path || format('/{0}', inputs.docker_image) }}
          export: file
          file: k8s/.infisical.env

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Secret manifest from K8S_SECRET
        if: ${{ !inputs.infisical }}
        working-directory: k8s
        env:
          K8S_SECRET: ${{ secrets.K8S_SECRET }}
        run: |
          [ -n "$K8S_SECRET" ] || { echo "::error::K8S_SECRET is required when Infisical is not used"; exit 1; }
          echo "$K8S_SECRET" | base64 -d > secret.yaml

      - name: Secret manifest from Infisical
        if: ${{ inputs.infisical }}
        uses: cabrera-evil/workflows/.github/actions/secrets-convert@master
        with:
          format: k8s-secret
          input: k8s/.infisical.env
          output: k8s/secret.yaml
          name: ${{ inputs.k8s_secret_name || format('{0}-secret', inputs.docker_image) }}

      - name: Install Kustomize
        working-directory: k8s
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Set Docker Image in Kustomize
        working-directory: k8s
        run: |
          IMAGE_TAG="${{ inputs.short_sha && format('sha-{0}', inputs.short_sha) || 'latest' }}"
          kustomize edit set image "${{ secrets.DOCKER_USERNAME }}/${{ inputs.docker_image }}=${{ secrets.DOCKER_USERNAME }}/${{ inputs.docker_image }}:$IMAGE_TAG"

      - name: Apply Kubernetes Manifests
        working-directory: k8s
        run: |
          kustomize build . | kubectl apply -f -
